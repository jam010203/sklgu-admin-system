<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKLGU Admin Dashboard - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 50%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -10%;
            right: -5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0ea5e9 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.1;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            left: -5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0284c7 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.1;
            z-index: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(2, 132, 199, 0.15);
            padding: 48px;
            max-width: 450px;
            width: 100%;
            backdrop-filter: blur(10px);
            animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(2, 132, 199, 0.15);
            position: relative;
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-container:hover {
            box-shadow: 0 30px 80px rgba(2, 132, 199, 0.2);
            transform: translateY(-2px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group:hover input {
            border-color: rgba(2, 132, 199, 0.25);
        }

        label {
            display: block;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 9px;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid rgba(2, 132, 199, 0.15);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(5px);
            font-weight: 500;
            color: #1e293b;
            font-family: inherit;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #0284c7;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
            transform: scale(1.01);
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #94a3b8;
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 50%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 24px;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.3);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(2, 132, 199, 0.45);
            background: linear-gradient(135deg, #0272a8 0%, #0c8ad4 50%, #0499c6 100%);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(2, 132, 199, 0.1);
        }

        .footer p {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }

        .copyright {
            margin-top: 8px;
            color: #cbd5e1;
            font-size: 12px;
        }

           .password-toggle {
               position: absolute;
               right: 15px;
               top: 38px;
               background: none;
               border: none;
               cursor: pointer;
               padding: 6px;
               display: flex;
               align-items: center;
               justify-content: center;
               color: #94a3b8;
               transition: all 0.3s ease;
               z-index: 10;
           }

           .password-toggle:hover {
               color: #0284c7;
               transform: scale(1.1);
           }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0284c7;
        }

        .remember-me label {
            margin: 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
        }

        .fun-fact {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: #0284c7;
            padding: 12px 14px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            animation: pulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            border-left: 4px solid #0284c7;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">🏛️</div>
            <h1>SKLGU Admin Portal</h1>
            <p class="subtitle">Secure Access for Administrators</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="admin@sklgu.gov.ph"
                    required
                >
                <div class="error-message" id="emailError">
                    Email must end with @sklgu.gov.ph
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                >
                <button type="button" class="password-toggle" onclick="togglePassword(event)" title="Show/Hide Password">
                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-off-icon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember me on this device</label>
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>
        </form>

        <div class="fun-fact">
            You're about to make government work amazing!
        </div>

        <div class="footer">
            <p>Sangguniang Kabataan Local Government Unit</p>
            <p class="copyright">© 2026 SKLGU. All rights reserved.</p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        // Load remembered email on page load
        window.addEventListener('DOMContentLoaded', function() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                emailInput.value = rememberedEmail;
                rememberMeCheckbox.checked = true;
            }
        });

           // Toggle password visibility
           function togglePassword(event) {
               event.preventDefault();
           
               const passwordInput = document.getElementById('password');
               const eyeIcon = document.querySelector('.eye-icon');
               const eyeOffIcon = document.querySelector('.eye-off-icon');
           
               if (passwordInput.type === 'password') {
                   passwordInput.type = 'text';
                   eyeIcon.style.display = 'none';
                   eyeOffIcon.style.display = 'block';
               } else {
                   passwordInput.type = 'password';
                   eyeIcon.style.display = 'block';
                   eyeOffIcon.style.display = 'none';
               }
           }

        // Email validation
        emailInput.addEventListener('input', function() {
            const email = this.value.trim();
            if (email && !email.endsWith('@sklgu.gov.ph')) {
                emailError.style.display = 'block';
                this.setCustomValidity('Email must end with @sklgu.gov.ph');
            } else {
                emailError.style.display = 'none';
                this.setCustomValidity('');
            }
        });

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = document.getElementById('password').value;

            // Validate email domain
            if (!email.endsWith('@sklgu.gov.ph')) {
                emailError.style.display = 'block';
                emailInput.focus();
                return false;
            }

            // Send login request to backend
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: 'Server error' }));
                    alert('Login failed: ' + (errorData.message || 'Server error'));
                    return;
                }

                const data = await response.json();
                console.log('Login response:', data);

                if (data.success) {
                    // Save email if remember me is checked
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    // Redirect to appropriate dashboard
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    alert('Login failed: ' + (data.message || 'Invalid credentials'));
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred during login. Please check your connection and try again.');
            }
        });
    </script>
</body>
</html>
