<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INOVISION - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-wrapper {
            display: flex;
            width: 90%;
            max-width: 1200px;
            min-height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .left-section {
            flex: 1;
            background: linear-gradient(135deg, #e0f7ff 0%, #f0f9ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
        }

        .illustration {
            width: 100%;
            max-width: 500px;
            height: auto;
            position: relative;
        }

        .illustration svg {
            width: 100%;
            height: auto;
        }

        .brand-logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 28px;
            font-weight: 700;
            color: #0891b2;
            letter-spacing: -0.5px;
        }

        .right-section {
            flex: 1;
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .welcome-text {
            font-size: 42px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .welcome-subtext {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .notification-icon {
            color: #f59e0b;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 18px;
            z-index: 1;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #0891b2;
            background: white;
        }

        .form-input::placeholder {
            color: #cbd5e1;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0891b2;
        }

        .remember-me .checkmark {
            color: #10b981;
            font-size: 18px;
        }

        .forgot-password {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #0891b2;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #0891b2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: #0e7490;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(8, 145, 178, 0.3);
        }

        .create-account {
            text-align: center;
        }

        .create-account a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .create-account a:hover {
            color: #0891b2;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #dc2626;
        }

        .login-type-toggle {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #e0f7ff;
            border-color: #0891b2;
            color: #0891b2;
        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 968px) {
            .login-wrapper {
                flex-direction: column;
            }

            .left-section {
                display: none;
            }

            .right-section {
                padding: 60px 40px;
            }
        }

        @media (max-width: 480px) {
            .welcome-text {
                font-size: 32px;
            }

            .right-section {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Left Section with Illustration -->
        <div class="left-section">
            <div class="brand-logo">INOVISION</div>
            <div class="illustration">
                <!-- Illustration SVG -->
                <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background circles -->
                    <circle cx="150" cy="120" r="8" fill="#93c5fd" opacity="0.4"/>
                    <circle cx="430" cy="200" r="6" fill="#93c5fd" opacity="0.3"/>
                    <circle cx="320" cy="350" r="10" fill="#93c5fd" opacity="0.3"/>
                    
                    <!-- Desk/Table -->
                    <path d="M 60 350 Q 250 340 440 350 L 440 360 Q 250 350 60 360 Z" fill="#3b82f6" opacity="0.8"/>
                    <rect x="60" y="360" width="380" height="15" fill="#2563eb" opacity="0.7"/>
                    
                    <!-- Person standing (left) -->
                    <ellipse cx="120" cy="200" rx="25" ry="30" fill="#1e293b"/>
                    <circle cx="120" cy="165" r="20" fill="#f1c27d"/>
                    <path d="M 105 165 Q 105 160 110 162 Q 115 164 108 168 Z" fill="#8b5a3c"/>
                    <rect x="105" y="200" width="30" height="60" rx="5" fill="#fbbf24"/>
                    <rect x="102" y="260" width="15" height="80" fill="#1e3a8a"/>
                    <rect x="121" y="260" width="15" height="80" fill="#1e3a8a"/>
                    <path d="M 135 220 L 170 250 L 165 260 L 130 230 Z" fill="#fbbf24"/>
                    
                    <!-- Laptop -->
                    <rect x="190" y="320" width="120" height="8" rx="2" fill="#64748b"/>
                    <rect x="200" y="260" width="100" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="3"/>
                    <rect x="210" y="270" width="80" height="40" fill="#0ea5e9"/>
                    <line x1="250" y1="270" x2="250" y2="310" stroke="#38bdf8" stroke-width="1"/>
                    <line x1="230" y1="290" x2="270" y2="290" stroke="#38bdf8" stroke-width="1"/>
                    
                    <!-- Person sitting (right) -->
                    <ellipse cx="380" cy="230" rx="22" ry="28" fill="#f8b4b4"/>
                    <circle cx="380" cy="200" r="18" fill="#f1c27d"/>
                    <path d="M 368 200 Q 368 195 372 197 Q 376 199 370 202 Z" fill="#8b5a3c"/>
                    <path d="M 390 200 Q 394 195 396 197 Q 398 199 392 202 Z" fill="#8b5a3c"/>
                    <rect x="366" y="230" width="28" height="50" rx="5" fill="#ec4899"/>
                    <rect x="364" y="280" width="14" height="40" fill="#831843"/>
                    <rect x="382" y="280" width="14" height="40" fill="#831843"/>
                    
                    <!-- Plant pot -->
                    <path d="M 345 315 L 355 340 L 370 340 L 380 315 Z" fill="#f97316"/>
                    <ellipse cx="362.5" cy="315" rx="20" ry="8" fill="#ea580c"/>
                    <path d="M 362 290 Q 365 300 362 315" stroke="#10b981" stroke-width="3" fill="none"/>
                    <path d="M 362 295 Q 355 300 357 310" stroke="#10b981" stroke-width="2.5" fill="none"/>
                    <path d="M 362 295 Q 369 300 367 310" stroke="#10b981" stroke-width="2.5" fill="none"/>
                    <circle cx="362" cy="290" r="6" fill="#22c55e"/>
                    <circle cx="357" cy="293" r="5" fill="#16a34a"/>
                    <circle cx="367" cy="293" r="5" fill="#16a34a"/>
                    
                    <!-- Decorative wave shape (blue) -->
                    <path d="M 440 380 Q 380 365 320 380 Q 260 395 200 380 Q 140 365 80 380 L 80 450 Q 140 435 200 450 Q 260 465 320 450 Q 380 435 440 450 Z" fill="#3b82f6" opacity="0.6"/>
                </svg>
            </div>
        </div>

        <!-- Right Section with Form -->
        <div class="right-section">
            <div class="welcome-text">Welcome Back :)</div>
            <div class="welcome-subtext">
                Inovision is where ideas turn into solutions, and vision becomes innovation.
                <span class="notification-icon">🔔</span>
            </div>

            <!-- Login Type Toggle -->
            <div class="login-type-toggle">
                <button type="button" class="toggle-btn active" onclick="switchTab('user')">User Login</button>
                <button type="button" class="toggle-btn" onclick="switchTab('admin')">Admin Login</button>
            </div>

            <!-- User Login Form -->
            <form id="userLoginForm" class="login-form active" method="POST" action="/login">
                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}
                <input type="hidden" name="login_type" value="user">

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" name="email" class="form-input" placeholder="Justin@ghostlamp.io" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" class="form-input" placeholder="••••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="userRememberMe" name="remember_me" class="remember-checkbox">
                        <span class="checkmark">✓</span>
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-password">Forget Password?</a>
                </div>

                <button type="submit" class="login-btn">Login Now</button>
            </form>

            <!-- Admin Login Form -->
            <form id="adminLoginForm" class="login-form" method="POST" action="/login">
                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}
                <input type="hidden" name="login_type" value="admin">

                <div class="form-group">
                    <label class="form-label">Admin Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" name="email" class="form-input" placeholder="admin@sklgu.gov.ph" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Admin Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" class="form-input" placeholder="••••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="adminRememberMe" name="remember_me" class="remember-checkbox">
                        <span class="checkmark">✓</span>
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-password">Forget Password?</a>
                </div>

                <button type="submit" class="login-btn">Login Now</button>
            </form>
        </div>
    </div>

    <script>
        // Remember Me functionality - loads saved email on page load
        document.addEventListener('DOMContentLoaded', function() {
            const userEmail = localStorage.getItem('rememberedUserEmail');
            const userRemember = localStorage.getItem('userRememberMe') === 'true';
            const adminEmail = localStorage.getItem('rememberedAdminEmail');
            const adminRemember = localStorage.getItem('adminRememberMe') === 'true';

            // Restore user login fields
            if (userEmail) {
                document.querySelector('#userLoginForm input[name="email"]').value = userEmail;
            }
            if (userRemember) {
                document.getElementById('userRememberMe').checked = true;
            }

            // Restore admin login fields
            if (adminEmail) {
                document.querySelector('#adminLoginForm input[name="email"]').value = adminEmail;
            }
            if (adminRemember) {
                document.getElementById('adminRememberMe').checked = true;
            }
        });

        // Save Remember Me preference on form submission
        document.getElementById('userLoginForm').addEventListener('submit', function() {
            const email = this.querySelector('input[name="email"]').value;
            const rememberMe = document.getElementById('userRememberMe').checked;
            
            if (rememberMe) {
                localStorage.setItem('rememberedUserEmail', email);
                localStorage.setItem('userRememberMe', 'true');
            } else {
                localStorage.removeItem('rememberedUserEmail');
                localStorage.setItem('userRememberMe', 'false');
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', function() {
            const email = this.querySelector('input[name="email"]').value;
            const rememberMe = document.getElementById('adminRememberMe').checked;
            
            if (rememberMe) {
                localStorage.setItem('rememberedAdminEmail', email);
                localStorage.setItem('adminRememberMe', 'true');
            } else {
                localStorage.removeItem('rememberedAdminEmail');
                localStorage.setItem('adminRememberMe', 'false');
            }
        });

        function switchTab(tab) {
            const userForm = document.getElementById('userLoginForm');
            const adminForm = document.getElementById('adminLoginForm');
            const toggleBtns = document.querySelectorAll('.toggle-btn');

            if (tab === 'user') {
                userForm.classList.add('active');
                adminForm.classList.remove('active');
                toggleBtns[0].classList.add('active');
                toggleBtns[1].classList.remove('active');
            } else {
                adminForm.classList.add('active');
                userForm.classList.remove('active');
                toggleBtns[1].classList.add('active');
                toggleBtns[0].classList.remove('active');
            }
        }
    </script>
</body>
</html>
