services:
  - type: web
    name: sklgu-admin-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        fromSecret: SECRET_KEY
    autoDeploy: true
